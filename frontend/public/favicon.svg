<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="chip" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#F3C878"/>
      <stop offset="46%" stop-color="#D4A24C"/>
      <stop offset="100%" stop-color="#8A6120"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1E2B47"/>
      <stop offset="100%" stop-color="#101728"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Chip -->
  <circle cx="16" cy="16" r="12" fill="url(#chip)"/>
  <!-- Inner highlight -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <!-- "5" label -->
  <text x="16" y="21.5" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="15"
        fill="rgba(255,255,255,0.88)"
        letter-spacing="-0.5">5</text>
</svg>
